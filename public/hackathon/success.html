<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Application Submitted - Hackathon Sandbox</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --panel: #11151c;
        --text: #f4f7fb;
        --muted: #9ca7b5;
        --border: #273140;
        --accent: #f8fafc;
        --accent-text: #0a0d12;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% -20%, rgba(48, 66, 92, 0.48), transparent 38%),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 16px;
      }

      .success-card {
        width: min(100%, 520px);
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(17, 21, 28, 0.94);
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.34);
        padding: 38px;
        text-align: center;
      }

      .success-icon {
        display: grid;
        width: 76px;
        height: 76px;
        margin: 0 auto 22px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: #14231e;
        color: #98f0c8;
        font-size: 2rem;
        font-weight: 900;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.85rem;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .registration-id {
        margin-top: 22px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0c1017;
        padding: 14px;
      }

      .registration-id strong {
        display: block;
        margin-top: 4px;
        color: var(--text);
        font-size: 1.05rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 24px;
        border-radius: 10px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 760;
        padding: 10px 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="success-card" aria-labelledby="success-heading">
        <div class="success-icon" aria-hidden="true">✓</div>
        <h1 id="success-heading">Application Submitted Successfully</h1>
        <p>Your sandbox profile and hackathon application have been completed.</p>

        <div class="registration-id">
          Registration ID
          <strong id="registration-id" data-testid="registration-id"></strong>
        </div>

        <a id="restart-flow" href="signin.html">Start Over</a>
      </section>
    </main>

    <script src="demo.js"></script>
    <script>
      const Demo = window.HackathonDemo;
      const idElement = document.getElementById("registration-id");
      if (Demo.sessionId) {
        idElement.textContent = "等待提交结果…";
        Demo.watch(Demo.sessionId, (state) => {
          if (state.registrationId) idElement.textContent = state.registrationId;
        });
      } else {
        idElement.textContent = "HK-DEMO-STANDALONE";
      }
    </script>
  </body>
</html>
